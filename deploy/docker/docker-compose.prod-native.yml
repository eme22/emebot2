name: embot-prod-native

services:
  mariadb:
    image: mariadb:11
    container_name: embot-mariadb-prod-native
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-s15_mbot}
      MYSQL_USER: ${DB_USER:-embot_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_prod_native_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck-sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: embot-lavalink-prod-native
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?LAVALINK_PASSWORD is required}
    ports:
      - "${LAVALINK_PORT:-2333}:2333"
    restart: always

  embot:
    image: embot:prod-native
    container_name: embot-prod-native
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.prod
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - QUARKUS_PROFILE=prod
      - DISCORD_TOKEN=${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      - CLIENT_TOKEN=${CLIENT_TOKEN:?CLIENT_TOKEN is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEB_ADMIN_USERNAME=${WEB_ADMIN_USERNAME:-admin}
      - WEB_ADMIN_PASSWORD=${WEB_ADMIN_PASSWORD:?WEB_ADMIN_PASSWORD is required}
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-s15_mbot}
      - DB_USER=${DB_USER:-embot_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_URL=jdbc:mariadb://mariadb:3306/${DB_NAME:-s15_mbot}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
      lavalink:
        condition: service_started
    restart: always

volumes:
  mariadb_prod_native_data:
