    datasource:
      db-kind: mariadb
      username: u15_qmC7fYGOKC
      password: ${DB_PASSWORD}
      jdbc:
        url: jdbc:mariadb://192.168.18.164:3306/s15_mbot
    hibernate-orm:
      database:
