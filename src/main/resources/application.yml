lavalink:
  servers:
    - name: Node1
      host: 192.168.18.164
      port: 2333
      password: ${LAVALINK_PASSWORD}
      region: peru
      secure: false
      timeout: 10000

"%dev":
  jda:
    token: ${DISCORD_TOKEN}
  lavalink:
    servers:
      - name: DevNode
        host: 10.241.251.82
        port: 2333
        password: ${LAVALINK_PASSWORD}
        region: peru
        secure: false
        timeout: 10000
  quarkus:
    datasource:
      db-kind: mariadb
      username: u15_qmC7fYGOKC
      password: ${DB_PASSWORD}
      jdbc:
        url: jdbc:mariadb://10.241.251.82:3306/s15_mbot
    hibernate-orm:
      database:
        generation: update
      enable-lazy-load-no-trans: true

"%prod":
